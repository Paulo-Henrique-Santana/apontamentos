<h1>Projetos</h1>

<div class="container">
  <table mat-table [dataSource]="projects">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          [matMenuTriggerFor]="menu"
          [matMenuTriggerData]="{ project: element }"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr *matNoDataRow>
      <td class="cell-no-data" [attr.colspan]="displayedColumns.length">Nenhum projeto cadastrado</td>
    </tr>
  </table>
</div>

<button mat-flat-button class="btn-add-project" (click)="openCreateDialog()">Cadastrar projeto</button>

<mat-menu #menu="matMenu">
  <ng-template matMenuContent let-project="project">
    <button mat-menu-item (click)="openEditDialog(project)">
      <mat-icon>edit</mat-icon>
      <span>Editar</span>
    </button>
    <button mat-menu-item (click)="openDeleteDialog(project)">
      <mat-icon>delete</mat-icon>
      <span>Excluir</span>
    </button>
  </ng-template>
</mat-menu>
