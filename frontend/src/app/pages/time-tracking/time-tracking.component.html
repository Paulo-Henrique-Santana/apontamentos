<h1>Apontamentos</h1>

<div>
  <div class="actions">
    <app-date-control
      (next)="nextWeek()"
      (previous)="lastWeek()"
      (today)="currentWeek()"
    ></app-date-control>

    <button mat-fab extended class="btn-add-project" (click)="openSelectProjectsDialog()">Selecionar projeto</button>
  </div>

  <table mat-table [dataSource]="timeEntries">
    <ng-container matColumnDef="project">
      <th mat-header-cell *matHeaderCellDef>Projeto</th>
      <td mat-cell *matCellDef="let element">{{ element.project.name }}</td>
    </ng-container>

    @for (day of weekDays; track $index) {
    <ng-container [matColumnDef]="day.label">
      <th mat-header-cell *matHeaderCellDef>
        {{ weekColumns[$index].label }} {{ day.date | date : "dd/MM" }}
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-form-field>
          <input
            matInput
            type="number"
            [value]="element[day.label]?.hours"
            (change)="onChangeTimeEntry(element, day, $event)"
          />
        </mat-form-field>
      </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="no-data-row" *matNoDataRow>
      <td class="cell-no-data" [attr.colspan]="displayedColumns.length">Nenhum apontamento cadastrado</td>
    </tr>
  </table>
</div>
