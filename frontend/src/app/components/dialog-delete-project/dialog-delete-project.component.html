<h2 mat-dialog-title>Confirmar exclusão</h2>
<mat-dialog-content>
  Tem certeza de que deseja excluir o projeto {{ nameProject }}?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Excluir</button>
</mat-dialog-actions>
